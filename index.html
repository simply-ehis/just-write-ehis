<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B1A15" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Just Write ehis — a personal writing super app." />
    <title>Just Write ehis</title>
    <link rel="icon" type="image/svg+xml" href="ehis-mark-dark.svg" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="service-worker" href="sw.js" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-render-blocking: display fonts enhance when online, never stall paint. -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" /></noscript>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("writing-app-settings") || "{}");
        // Legacy single-theme installs migrate: dark/brutalist/glass = dark
        // base, light = light base; style defaults to the plain room.
        var legacy = s.theme;
        var style = (legacy === "brutalist" || legacy === "glass") ? legacy : "default";
        var mode = s.themeMode === "light" || (s.themeMode !== "dark" && legacy === "light") ? "light" : "dark";
        document.documentElement.dataset.theme = style;
        document.documentElement.dataset.mode = mode;
        if (typeof s.accentOverride === "string" && /^#[0-9a-fA-F]{6}$/.test(s.accentOverride)) {
          var hex = s.accentOverride.toLowerCase();
          var st = document.documentElement.style;
          st.setProperty("--accent", hex);
          st.setProperty("--accent-primary", hex);
          st.setProperty("--accent-write", hex);
        }
      } catch (e) {}
    </script>
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.log('SW registration failed:', err));
        });
      }
      // Handle share target
      if (navigator.share) {
        // App can receive shared content
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
