<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B1A15" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Just Write ehis — a personal writing super app." />
    <title>Just Write ehis</title>
    <link rel="icon" type="image/svg+xml" href="ehis-mark-dark.svg" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="service-worker" href="sw.js" />
    <!-- Local-first: display type is self-hosted (see app.css), zero remote requests. -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("writing-app-settings") || "{}");
        // Legacy single-theme installs migrate: dark/brutalist/glass = dark
        // base, light = light base; style defaults to the plain room.
        var legacy = s.theme;
        var style = (legacy === "brutalist" || legacy === "glass") ? legacy : "default";
        var mode = s.themeMode === "light" || (s.themeMode !== "dark" && legacy === "light") ? "light" : "dark";
        document.documentElement.dataset.theme = style;
        document.documentElement.dataset.mode = mode;
        var st = document.documentElement.style;
        if (typeof s.accentOverride === "string" && /^#[0-9a-fA-F]{6}$/.test(s.accentOverride)) {
          var hex = s.accentOverride.toLowerCase();
          st.setProperty("--accent", hex);
          st.setProperty("--accent-primary", hex);
          st.setProperty("--accent-write", hex);
        }
        var editorFonts = ["JetBrains Mono", "Fira Code", "Source Code Pro", "IBM Plex Mono", "Cascadia Code", "Consolas", "monospace"];
        var editorFont = editorFonts.includes(s.fontFamily) ? s.fontFamily : "JetBrains Mono";
        var fontSize = Math.min(32, Math.max(10, Number(s.fontSize) || 15));
        var lineHeight = Math.min(3, Math.max(1, Number(s.lineHeight) || 1.7));
        st.setProperty("--editor-font-family", editorFont === "monospace" ? "monospace" : '"' + editorFont + '", "Cascadia Code", Consolas, monospace');
        st.setProperty("--editor-font-size", fontSize + "px");
        st.setProperty("--editor-line-height", String(lineHeight));
      } catch (e) {}
    </script>
    <script>
      // Service worker: web/PWA (Android share target, notification capture)
      // ONLY — never in the Tauri desktop shell.
      //
      // The desktop frontend is embedded in the binary, so there is no network
      // origin to be resilient against: a cache buys nothing there. Worse, a
      // cache-first worker outlives the content-hashed chunks it references —
      // an app update leaves the cached document pointing at chunks the new
      // build no longer ships. The entry module then 404s (served as text/html),
      // main.ts never runs, #app stays empty, and the hidden main window is
      // never revealed: a ghost window with a dead frontend, so every IPC
      // command (AI, STT/TTS/LLM, memory, pandoc, the widget) fails too.
      //
      // So: register only outside Tauri, and actively unregister + drop caches
      // inside it. The unregister is what heals installs that a previous build
      // already poisoned — an active worker keeps controlling the page until it
      // is removed, so skipping registration alone would not free them.
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var inTauri = !!(window.isTauri || (window.__TAURI_INTERNALS__));
        if (inTauri) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) { reg.unregister(); });
          }).catch(function () { /* nothing to heal */ });
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              keys.forEach(function (key) { caches.delete(key); });
            }).catch(function () { /* nothing to clear */ });
          }
          return;
        }
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js')
            .then(function (reg) { console.log('SW registered:', reg.scope); })
            .catch(function (err) { console.log('SW registration failed:', err); });
        });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
