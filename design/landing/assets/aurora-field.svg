<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Aurora field</title>
  <desc id="desc">An abstract field of blurred mineral light over a dark technical grid.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101713"/><stop offset=".52" stop-color="#1c2a25"/><stop offset="1" stop-color="#101312"/></linearGradient>
    <radialGradient id="mint"><stop stop-color="#c9f5d7" stop-opacity=".88"/><stop offset="1" stop-color="#8fc7a9" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue"><stop stop-color="#9ec8e8" stop-opacity=".58"/><stop offset="1" stop-color="#4a7796" stop-opacity="0"/></radialGradient>
    <radialGradient id="amber"><stop stop-color="#f2d48d" stop-opacity=".7"/><stop offset="1" stop-color="#b97937" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="52"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#d9f2df" stroke-opacity=".09"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#base)"/>
  <g filter="url(#blur)">
    <ellipse cx="240" cy="180" rx="430" ry="250" fill="url(#mint)"/>
    <ellipse cx="1220" cy="580" rx="500" ry="310" fill="url(#blue)"/>
    <ellipse cx="840" cy="120" rx="280" ry="180" fill="url(#amber)"/>
  </g>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".72"/>
  <path d="M0 760C310 650 510 820 820 700s490-220 780-40" fill="none" stroke="#d9f2df" stroke-opacity=".2" stroke-width="2"/>
  <circle cx="1280" cy="170" r="8" fill="#f2d48d"/>
  <circle cx="1280" cy="170" r="28" fill="none" stroke="#f2d48d" stroke-opacity=".3"/>
</svg>
