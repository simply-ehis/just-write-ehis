<svg width="560" height="320" viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Redo: hand-drawn jagged strokes (no font dependency), pure black, transparent.
       Quill standing vertical at the starting point. Wordmark horizontal.
       Lone dash between t and h. Ink-spill dot over the i. Nothing else. -->

  <g fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- t stem -->
    <path d="M 148,70 L 152,100 L 147,130 L 153,160 L 148,190 L 152,215 L 150,238 Q 150,250 163,252 L 176,253"/>
    <!-- t cross -->
    <path d="M 117,153 L 140,147 L 165,150 L 185,145"/>
    <!-- h stem -->
    <path d="M 243,70 L 247,110 L 243,150 L 248,190 L 244,225 L 246,250"/>
    <!-- h arch + hump -->
    <path d="M 246,176 L 258,158 L 275,149 L 292,151 L 300,164 L 302,190 L 300,220 L 302,250"/>
    <!-- i stem -->
    <path d="M 348,152 L 352,185 L 349,215 L 351,250"/>
    <!-- s -->
    <path d="M 458,150 Q 442,146 430,154 Q 420,162 424,174 L 436,184 L 454,192 Q 466,198 464,212 Q 462,230 444,240 Q 430,248 412,246"/>
  </g>

  <!-- lone dash tucked close to the t, at top-of-t height -->
  <path d="M 187,87 L 217,79" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>

  <!-- ink-spill dot over the i: main drop + spill tail + satellites -->
  <path d="M 352,70 C 364,68 374,76 373,88 C 372,100 360,107 350,103 C 340,99 338,87 344,79 C 346,75 349,72 352,70 Z" fill="#FFFFFF"/>
  <path d="M 366,98 Q 371,108 368,118 Q 362,111 362,103 Z" fill="#FFFFFF"/>
  <circle cx="389" cy="94" r="3.5" fill="#FFFFFF"/>
  <circle cx="329" cy="106" r="2.2" fill="#FFFFFF"/>

  <!-- quill standing vertically at the starting point -->
  <path d="M 95,252 L 93,200 L 81,150 L 74,100 L 81,60 L 89,35 L 95,24 L 101,35 L 109,60 L 101,100 L 109,150 L 97,200 Z" fill="#FFFFFF"/>
  <path d="M 95,190 L 95,252" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

  <!-- dimension: the word sits on the ground, the quill stands on it -->
  <path d="M 68,258 L 482,258" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="95" cy="254" rx="17" ry="4" fill="#FFFFFF"/>
</svg>
