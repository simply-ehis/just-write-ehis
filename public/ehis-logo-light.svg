<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Just Write ehis — pen wrote 'this' with E-tick">
  <title>Just Write ehis — just wrote this</title>
  <desc>Paper-ink variant for dark / glass surfaces. Same mark as ehis-logo-dark.svg with ink and knockout colors swapped.</desc>

  <g fill="none" stroke="#F1EFE6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Floating E-tick above the t: THIS stroke makes the t read as E -->
    <path d="M 138 108 C 170 102 210 98 248 96" stroke-width="15"/>

    <!-- t: tall stem + crossbar -->
    <path d="M 208 128 C 198 168 184 224 172 266 C 165 290 168 308 190 311 C 214 314 240 300 258 282" stroke-width="11"/>
    <path d="M 118 202 C 158 196 212 190 262 184" stroke-width="10"/>

    <!-- h: tall loop stem -->
    <path d="M 322 112 C 308 150 292 202 282 242 C 276 264 276 284 288 288" stroke-width="11"/>
    <!-- h arch + hump down to baseline -->
    <path d="M 284 250 C 296 230 312 216 332 212 C 352 208 366 220 368 242 C 370 262 368 280 364 296" stroke-width="11"/>

    <!-- h exit ligature into i -->
    <path d="M 364 296 C 390 296 420 288 448 276" stroke-width="9"/>

    <!-- i stem -->
    <path d="M 486 222 C 481 244 478 264 481 282 C 483 294 494 297 505 290 C 518 281 534 268 552 258" stroke-width="11"/>

    <!-- s: upper curve, lower bowl, exit tail to nib -->
    <path d="M 596 232 C 610 222 626 222 628 234 C 630 246 616 254 600 262 C 582 271 566 280 570 292 C 574 304 592 306 612 300 C 640 291 668 278 700 278 C 736 278 766 296 796 306" stroke-width="11"/>

    <!-- Ground line -->
    <path d="M 42 316 L 856 316" stroke-width="4"/>
  </g>

  <g fill="#F1EFE6">
    <circle cx="502" cy="168" r="16"/>
    <circle cx="533" cy="164" r="6"/>
    <ellipse cx="798" cy="316" rx="34" ry="10"/>
  </g>

  <g transform="translate(798 310) rotate(28)">
    <path d="M 0 0 L -20 -58 C -22 -76 -11 -98 0 -104 C 11 -98 22 -76 20 -58 L 0 0 Z" fill="#F1EFE6"/>
    <circle cx="0" cy="-52" r="7.5" fill="#1B1A15"/>
    <path d="M 0 -45 L 0 -6" stroke="#1B1A15" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="-24" y="-132" width="48" height="26" rx="5" fill="#F1EFE6"/>
    <path d="M -24 -112 L 24 -112" stroke="#1B1A15" stroke-width="3"/>
  </g>
</svg>
