[[set]]
identifier = "widget"
description = "The companion widget is a frame around ONE mini widget (Quick note or Reader), not a window that hosts a tab, so it gets only the four commands those mini widgets call: the boot-ready poll, today's log (get or create) plus save for Quick note, and the bookshelf read for Reader. Everything else is withheld on purpose, including credentials, vault administration, AI, voice, memory, search and raw file-system access. Updater and process-exit stay on the main window only."
permissions = [
  "allow-app-boot-ready",
  "allow-doc-save",
  "allow-log-get-or-create",
  "allow-reader-get-bookshelf"
]
