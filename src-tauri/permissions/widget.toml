[[permission]]
identifier = "widget"
description = "Existing document, log, capture, and save commands used by the companion window. Sidecars, secrets, filesystem, watcher, and updater commands are deliberately absent so the ACL refuses them even if the widget code changes."
permissions = [
  "allow-doc-get",
  "allow-doc-create",
  "allow-doc-save",
  "allow-doc-search-full",
  "allow-log-get-or-create",
  "allow-usage-record",
  "allow-atomic-save",
  "allow-bible-get-facts",
  "allow-snapshot-list",
]
