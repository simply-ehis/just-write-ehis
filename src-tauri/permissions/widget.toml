[[permission]]
identifier = "widget"
description = "Existing document, log, capture, save, and narrow app-lock verification commands used by the companion window. General secrets, sidecars, filesystem, watcher, and updater commands are deliberately absent."
permissions = [
  "allow-widget-doc-get",
  "allow-doc-create",
  "allow-widget-doc-save",
  "allow-doc-search-full",
  "allow-log-get-or-create",
  "allow-usage-record",
  "allow-widget-atomic-save",
  "allow-bible-get-facts",
   "allow-snapshot-list",
   "allow-app-lock-configured",
 ]
