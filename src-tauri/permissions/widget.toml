[[set]]
identifier = "widget"
description = "Every application command reachable from a workspace the companion can display. The widget can host any workspace the user picks, so it carries the full workspace surface: documents, search, logs, dashboards, graph, canvas, novel, script, reader, projects, AI, voice, and memory. Deliberately withheld: credential access (secret_get/secret_set) and whole-vault administration (backup, vault rename, autostart launch, provider and Python probes) - the companion holds no secrets and has no Settings surface, so granting those would widen its attack surface for no feature it can use. Updater and process-exit stay on the main window only."
permissions = [
  "allow-add-doc-tag",
  "allow-ai-generate",
