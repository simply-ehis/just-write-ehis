[package]
name = "just-write-ehis"
version = "0.2.2"
edition = "2021"
authors = ["simply-ehis"]
description = "Just Write ehis — a personal super app for writing and everything around writing"
license = "AGPL-3.0-only"

[lib]
name = "just_write_ehis_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Required by tauri-build to decide whether the app serves the frontend
# embedded in the binary or the Vite devUrl. Without it, `cfg(dev)` is always
# set, so a release build silently targets http://localhost:5173: with no dev
# server running the webview never loads, #app stays empty, and the hidden
# main window is never revealed — a ghost window with no way to surface it.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "=2.11.0"
tauri-plugin-process = "2"
# Desktop OS notifications (conflict-found, long AI job finished). The
# WebView has no Notification API on Windows, so the Web path in
# osNotifications.ts is the browser-preview fallback only.
tauri-plugin-notification = "2"
pulldown-cmark = "0.12"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sqlite-vec = "0.1"
zerocopy = { version = "0.8", features = ["derive"] }
dirs = "5"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time"] }
notify = "7"
tempfile = "3"
ammonia = "3.3"
keyring = "4"
quick-xml = "0.42.0"
zip = "8.6.0"

[target."cfg(target_os = \"windows\")".dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.5"
# Already in the tree transitively (0.61.3); only feature flags are added here.
# Used for the sidecar Job Object, which kills child processes if this one dies
# without running its Drop impls (crash, kill, power loss).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
] }
